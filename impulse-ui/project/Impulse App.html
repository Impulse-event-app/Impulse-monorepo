<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>impulse — app</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0b0a09;-webkit-font-smoothing:antialiased}
  #root{width:100%}
  button{font-family:inherit}
  ::-webkit-scrollbar{display:none}
  *{scrollbar-width:none}
  @keyframes imp-slide{from{transform:translateX(100%)}to{transform:translateX(0)}}
  @keyframes imp-rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes imp-pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes imp-blink{0%,60%{opacity:1}61%,100%{opacity:.25}}
  @keyframes imp-ring{0%{transform:scale(.37);opacity:.9}70%{opacity:.12}100%{transform:scale(1);opacity:0}}
  @keyframes imp-fade{from{opacity:0}to{opacity:1}}
  @keyframes imp-fadeup{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-src="ios-frame.jsx">
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

/* BEGIN USAGE */
// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports (to window): IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard
//
// Usage — wrap your screen content in <IOSDevice> to get the bezel, status bar
// and home indicator (props: title, dark, keyboard):
//
//   <IOSDevice title="Settings">
//     ...your screen content...
//   </IOSDevice>
//   <IOSDevice dark title="Search" keyboard>…</IOSDevice>
/* END USAGE */

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>

<script type="text/babel" data-src="tweaks-panel.jsx">

// tweaks-panel.jsx

// individual prototypes don't re-roll it. Ships a consistent set of controls so you
// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):
//
//   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

/* END USAGE */
// ─────────────────────────────────────────────────────────────────────────────

const __TWEAKS_STYLE = `

    max-height:calc(100vh - 32px);display:flex;flex-direction:column;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

  const [now, setNow] = React.useState(Date.now());

    return () => clearInterval(id);
  }, []);
  return Math.max(0, target - now);
}
function fmtCountdown(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;

// apply a filter object to the dataset
function applyFilters(list, f) {
  let out = list.filter((d) =>
    (f.cats.length === 0 || f.cats.includes(d.cat)) &&
    (f.areas.length === 0 || f.areas.includes(d.suburb)) &&
    (f.when === "all" || d.status === f.when) &&
    (d.cap >= f.party) &&
    (d.now <= f.maxPrice)
  );
  if (f.sort === "closest") out = [...out].sort((a, b) => a.km - b.km);
  else if (f.sort === "price") out = [...out].sort((a, b) => a.now - b.now);
  else if (f.sort === "rating") out = [...out].sort((a, b) => b.rating - a.rating);
  return out;
}

  n += f.sort !== "closest" ? 1 : 0;
  return n;
}

// ── faux QR (deterministic module grid) ──────────────────────
function FauxQR({ code, size = 132 }) {
  const T = useT();
  const N = 13;
  // deterministic fill from code hash
  let h = 0; for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) >>> 0;
  const rng = (i) => { const x = Math.sin(h + i * 12.9898) * 43758.5453; return x - Math.floor(x); };
  const isFinder = (r, c) => (r < 3 && c < 3) || (r < 3 && c >= N - 3) || (r >= N - 3 && c < 3);
  const cells = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const finder = isFinder(r, c);
    const on = finder ? ((r === 0 || r === 2 || r === N - 1 || r === N - 3 || c === 0 || c === 2 || c === N - 1 || c === N - 3) ? true : (r === 1 && c === 1) || (r === 1 && c === N - 2) || (r === N - 2 && c === 1)) : rng(r * N + c) > 0.5;
    cells.push(on);
  }
  return (
    <div style={{ width: size, height: size, background: "#fff", borderRadius: 14, padding: 12, boxSizing: "border-box" }}>
      <div style={{ width: "100%", height: "100%", display: "grid", gridTemplateColumns: `repeat(${N},1fr)`, gridTemplateRows: `repeat(${N},1fr)`, gap: 1.5 }}>
        {cells.map((on, i) => <div key={i} style={{ background: on ? "#0F0E0D" : "transparent", borderRadius: 1 }} />)}
      </div>
    </div>
  );
}

<script type="text/babel" data-src="app-filters.jsx">
// app-filters.jsx — Impulse filters bottom-sheet
const { useT, CATEGORIES, AREAS, DEFAULT_FILTERS, applyFilters, money } = window;
const { FONT_UI, FONT_DISPLAY, FONT_MONO, Btn } = window;

const ACTS = CATEGORIES.filter((c) => c !== "All");

// ── a small labelled section ─────────────────────────────────
function FRow({ label, hint, children }) {
  const T = useT();
  return (
    <div style={{ padding: "20px 22px", borderBottom: `1px solid ${T.line}` }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 14 }}>
        <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 16.5, color: T.text }}>{label}</span>
        {hint && <span style={{ fontFamily: FONT_UI, fontSize: 13.5, color: T.faint }}>{hint}</span>}
      </div>
      {children}
    </div>
  );
}

// pill toggle used for multi-selects + segmented choices
function FPill({ children, on, onClick, dot }) {
  const T = useT();
  return (
    <button onClick={onClick} style={{
      height: 40, padding: "0 16px", borderRadius: 12, cursor: "pointer", border: "none",
      fontFamily: FONT_UI, fontWeight: 500, fontSize: 14.5, letterSpacing: "-0.01em", whiteSpace: "nowrap",
      background: on ? T.accent : T.chipBg, color: on ? T.accentInk : T.text,
      display: "inline-flex", alignItems: "center", gap: 8, transition: "background .14s, color .14s",
    }}>
      {dot && <span style={{ width: 7, height: 7, borderRadius: "50%", background: on ? T.accentInk : T.faint }} />}
      {children}
    </button>
  );
}

// segmented control (When)
function Segmented({ value, options, onChange }) {
  const T = useT();
  return (
    <div style={{ display: "flex", background: T.chipBg, borderRadius: 13, padding: 4, gap: 4 }}>
      {options.map((o) => {
        const on = value === o.id;
        return (
          <button key={o.id} onClick={() => onChange(o.id)} style={{
            flex: 1, height: 40, borderRadius: 10, border: "none", cursor: "pointer",
            fontFamily: FONT_UI, fontWeight: on ? 600 : 500, fontSize: 14.5,
            background: on ? T.surface : "transparent", color: on ? T.text : T.muted,
            boxShadow: on ? T.shadow : "none", transition: "background .14s, color .14s",
          }}>{o.label}</button>
        );
      })}
    </div>
  );
}

// party-size stepper, compact inline
function PartyInline({ value, onChange }) {
  const T = useT();
  const btn = (label, fn, dis) => (
    <button onClick={fn} disabled={dis} style={{
      width: 40, height: 40, borderRadius: 11, border: `1.5px solid ${T.line2}`, background: "transparent",
      color: dis ? T.faint : T.text, fontSize: 22, cursor: dis ? "default" : "pointer",
      display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1, opacity: dis ? 0.45 : 1,
    }}>{label}</button>
  );
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
      <span style={{ fontFamily: FONT_UI, fontSize: 15, color: T.muted }}>{value === 1 ? "Just me" : `${value} people`}</span>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        {btn("−", () => onChange(Math.max(1, value - 1)), value <= 1)}
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 20, color: T.text, minWidth: 20, textAlign: "center" }}>{value}</span>
        {btn("+", () => onChange(Math.min(10, value + 1)), value >= 10)}
      </div>
    </div>
  );
}

// price ceiling slider (native range, themed)
function PriceSlider({ value, onChange }) {
  const T = useT();
  const max = 40;
  const fillPct = ((value - 10) / (max - 10)) * 100;
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
        <span style={{ fontFamily: FONT_UI, fontSize: 15, color: T.muted }}>Up to</span>
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 20, color: T.text }}>
          {value >= max ? "Any price" : `${money(value)}`}
        </span>
      </div>
      <input type="range" min={10} max={max} step={1} value={value}
        onChange={(e) => onChange(+e.target.value)}
        style={{
          width: "100%", height: 6, borderRadius: 6, appearance: "none", WebkitAppearance: "none", cursor: "pointer",
          background: `linear-gradient(to right, ${T.accent} ${fillPct}%, ${T.chipBg} ${fillPct}%)`,
          outline: "none",
        }} />
    </div>
  );
}

const SORTS = [
  { id: "closest", label: "Closest" },
  { id: "price", label: "Lowest price" },
  { id: "rating", label: "Top rated" },
];

// ── the sheet ────────────────────────────────────────────────
function FiltersSheet({ initial, onApply, onClose }) {
  const T = useT();
  const [f, setF] = React.useState(initial);
  const set = (patch) => setF((p) => ({ ...p, ...patch }));
  const toggle = (key, val) => setF((p) => ({ ...p, [key]: p[key].includes(val) ? p[key].filter((x) => x !== val) : [...p[key], val] }));

  const count = applyFilters(window.DROPS, f).length;
  const isDefault = JSON.stringify(f) === JSON.stringify(DEFAULT_FILTERS);

  return (
    <div style={{ position: "absolute", inset: 0, zIndex: 60, display: "flex", flexDirection: "column", justifyContent: "flex-end" }}>
      {/* scrim */}
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.5)", animation: "imp-fade .2s ease" }} />

      {/* sheet body */}
      <div style={{
        position: "relative", background: T.bg, borderRadius: "26px 26px 0 0", maxHeight: "86%",
        display: "flex", flexDirection: "column", animation: "imp-rise .3s cubic-bezier(.2,.8,.2,1)",
        boxShadow: "0 -18px 50px rgba(0,0,0,0.4)",
      }}>
        {/* grabber + header */}
        <div style={{ flex: "0 0 auto" }}>
          <div style={{ width: 38, height: 5, borderRadius: 3, background: T.line2, margin: "10px auto 0" }} />
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 22px 14px" }}>
            <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 22, color: T.text, letterSpacing: "-0.02em" }}>Filters</span>
            <button onClick={() => setF(DEFAULT_FILTERS)} disabled={isDefault} style={{
              background: "none", border: "none", cursor: isDefault ? "default" : "pointer",
              fontFamily: FONT_UI, fontWeight: 500, fontSize: 15, color: isDefault ? T.faint : T.accent, opacity: isDefault ? 0.5 : 1, padding: 0,
            }}>Clear all</button>
          </div>
        </div>

        {/* scroll area */}
        <div style={{ overflowY: "auto", flex: 1, borderTop: `1px solid ${T.line}` }}>
          <FRow label="What" hint={f.cats.length ? `${f.cats.length} selected` : "Anything"}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 9 }}>
              {ACTS.map((a) => <FPill key={a} dot on={f.cats.includes(a)} onClick={() => toggle("cats", a)}>{a}</FPill>)}
            </div>
          </FRow>

          <FRow label="When">
            <Segmented value={f.when} onChange={(v) => set({ when: v })}
              options={[{ id: "all", label: "Anytime" }, { id: "now", label: "On now" }, { id: "later", label: "Later tonight" }]} />
          </FRow>

          <FRow label="Where" hint={f.areas.length ? `${f.areas.length} areas` : "All of Sydney"}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 9 }}>
              {AREAS.map((s) => <FPill key={s} on={f.areas.includes(s)} onClick={() => toggle("areas", s)}>{s}</FPill>)}
            </div>
          </FRow>

          <FRow label="Party size">
            <PartyInline value={f.party} onChange={(v) => set({ party: v })} />
          </FRow>

          <FRow label="Price">
            <PriceSlider value={f.maxPrice} onChange={(v) => set({ maxPrice: v })} />
          </FRow>

          <FRow label="Sort by">
            <div style={{ display: "flex", gap: 9 }}>
              {SORTS.map((s) => <FPill key={s.id} on={f.sort === s.id} onClick={() => set({ sort: s.id })}>{s.label}</FPill>)}
            </div>
          </FRow>
        </div>

        {/* sticky apply */}
        <div style={{ flex: "0 0 auto", padding: "14px 22px 30px", borderTop: `0.5px solid ${T.line}`, background: T.bg }}>
          <Btn full onClick={() => onApply(f)} disabled={count === 0}>
            {count === 0 ? "No drops match" : `Show ${count} ${count === 1 ? "drop" : "drops"}`}
          </Btn>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { FiltersSheet });

</script>

// ── flow controller (swipeable track + dots) ─────────────────
function Onboarding({ tone, onComplete }) {
  const T = useT();
  const [step, setStep] = React.useState(0);
  const [drag, setDrag] = React.useState(0);
  const [w, setW] = React.useState(402);
  const wrapRef = React.useRef(null);
  const dragState = React.useRef({ active: false, x0: 0, moved: false });

  React.useLayoutEffect(() => {
    const measure = () => { if (wrapRef.current) setW(wrapRef.current.clientWidth); };
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, []);

  const [suburb, setSuburb] = React.useState(null);
  const [acts, setActs] = React.useState([]);
  const [ageDeclined, setAgeDeclined] = React.useState(false);

  const STEPS = ["hero", "signin", "location", "notifications", "age", "suburb", "activities"];
  const n = STEPS.length;
  const go = (i) => setStep(Math.max(0, Math.min(n - 1, i)));
  const next = () => go(step + 1);

  // swipe handlers (only horizontal intent; clicks pass through)
  const onDown = (e) => { dragState.current = { active: true, x0: e.clientX, moved: false }; };
  const onMove = (e) => {
    const s = dragState.current; if (!s.active) return;
    const dx = e.clientX - s.x0;
    if (Math.abs(dx) > 6) s.moved = true;
    // resist at edges
    let d = dx;
    if ((step === 0 && dx > 0) || (step === n - 1 && dx < 0)) d = dx * 0.32;
    setDrag(d);
  };
  const onUp = () => {
    const s = dragState.current; if (!s.active) return;
    s.active = false;
    if (drag < -64) go(step + 1);
    else if (drag > 64) go(step - 1);
    setDrag(0);
  };

  const toggleAct = (a) => setActs((p) => p.includes(a) ? p.filter((x) => x !== a) : [...p, a]);

  const panels = [
    <HeroSplash key="hero" tone={tone} onStart={next} onSignin={next} />,
    <SignInStep key="signin" onContinue={next} />,
    <PermissionStep key="loc" glyph={<GlyphPin />} kicker="Find your area"
      title="What's on near you" body="Impulse uses your location to surface drops within a few suburbs — never in the background, only while you're looking."
      allowLabel="Allow location" onAllow={next} onSkip={next} />,
    <PermissionStep key="notif" glyph={<GlyphBell />} kicker="Stay in the loop"
      title="Get the drop" body="A nudge when something good opens up near you tonight. No daily blast, no noise — just the ones worth leaving the house for."
      allowLabel="Turn on notifications" onAllow={next} onSkip={next} />,
    <AgeStep key="age" declined={ageDeclined} onYes={next} onNo={() => { setAgeDeclined(true); setTimeout(next, 650); }} />,
    <SuburbStep key="suburb" value={suburb} onPick={setSuburb} onContinue={next} />,
    <ActivitiesStep key="acts" selected={acts} onToggle={toggleAct} onDone={() => onComplete({ suburb, acts })} />,
  ];

  return (
    <div style={{ position: "absolute", inset: 0, background: T.bg, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      {/* progress dots + skip */}
      <div style={{ position: "absolute", top: OB_TOP - 4, left: 0, right: 0, zIndex: 20, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 22px", pointerEvents: "none" }}>
        <div style={{ display: "flex", gap: 6, pointerEvents: "auto" }}>
          {STEPS.map((_, i) => (
            <button key={i} onClick={() => go(i)} style={{
              width: i === step ? 22 : 7, height: 7, borderRadius: 4, border: "none", padding: 0, cursor: "pointer",
              background: i === step ? T.accent : T.line2, transition: "width .25s, background .25s",
            }} />
          ))}
        </div>
        <button onClick={onComplete} style={{ pointerEvents: "auto", background: "none", border: "none", cursor: "pointer", fontFamily: FONT_UI, fontWeight: 500, fontSize: 14, color: T.faint }}>
          {step === n - 1 ? "" : "Skip"}
        </button>
      </div>

      {/* swipeable track */}
      <div ref={wrapRef} style={{ flex: 1, overflow: "hidden" }}>
        <div
          onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}
          style={{ display: "flex", height: "100%", width: w * n, touchAction: "pan-y",
            transform: `translateX(${-step * w + drag}px)`,
            transition: dragState.current.active ? "none" : "transform .34s cubic-bezier(.25,.8,.3,1)",
          }}>
          {panels.map((p, i) => (
            <div key={i} style={{ flex: `0 0 ${w}px`, width: w, height: "100%" }}>{p}</div>
          ))}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { Onboarding });

</script>

<script type="text/babel" data-src="app-main.jsx">
// app-main.jsx — Impulse app: router, theme, tweaks, device mount
const { tokens, ThemeCtx, DROPS, DEFAULT_FILTERS } = window;
const { TonightScreen, MapScreen, PlansScreen, DetailScreen, ClaimScreen, ConfirmScreen, TabBar, Onboarding, FiltersSheet, ProfileScreen } = window;
const { IOSDevice } = window;
const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle, TweakColor, TweakButton } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": true,
  "accent": "#FF5A4D",
  "intro": "Minimal",
  "home": "Editorial"
}/*EDITMODE-END*/;

const genCode = () => "IMP-" + Math.floor(1000 + Math.random() * 9000);

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const T = tokens(t.dark, t.accent);

  const [onboarded, setOnboarded] = React.useState(false);
  const [tab, setTab] = React.useState("tonight");
  const [detailId, setDetailId] = React.useState(null);
  const [claimDrop, setClaimDrop] = React.useState(null);
  const [confirm, setConfirm] = React.useState(null);
  const [plans, setPlans] = React.useState([]);
  const [filters, setFilters] = React.useState(DEFAULT_FILTERS);
  const [filtersOpen, setFiltersOpen] = React.useState(false);
  const [profile, setProfile] = React.useState({ name: "Jordan Lee", phone: "+61 4XX XXX 891", suburb: "Surry Hills", acts: ["Bowling", "Karaoke", "Live music"], party: 2 });

  const detail = DROPS.find((d) => d.id === detailId) || null;

  const openDrop = (id) => setDetailId(id);
  const doConfirm = ({ d, party, time, total }) => {
    const code = genCode();
    const plan = { code, d, venue: d.venue, cat: d.cat, party, time, total };
    setPlans((p) => [plan, ...p]);
    setConfirm(plan);
  };
  const goPlans = () => { setConfirm(null); setClaimDrop(null); setDetailId(null); setTab("plans"); };
  const goTonight = () => { setConfirm(null); setClaimDrop(null); setDetailId(null); setTab("tonight"); };
  const completeOnboarding = (data) => {
    if (data && (data.suburb || (data.acts && data.acts.length)))
      setProfile((p) => ({ ...p, suburb: data.suburb || p.suburb, acts: data.acts && data.acts.length ? data.acts : p.acts }));
    setOnboarded(true);
  };
  const signOut = () => { setTab("tonight"); setDetailId(null); setClaimDrop(null); setConfirm(null); setFilters(DEFAULT_FILTERS); setOnboarded(false); };

  const screen = tab === "tonight"
    ? <TonightScreen layout={t.home === "Compact" ? "compact" : "editorial"} filters={filters} onSetFilters={setFilters} onOpenFilters={() => setFiltersOpen(true)} onOpen={openDrop} />
    : tab === "map"
      ? <MapScreen filters={filters} onOpenFilters={() => setFiltersOpen(true)} onOpen={openDrop} />
      : tab === "plans"
        ? <PlansScreen plans={plans} onTonight={() => setTab("tonight")} onOpenPlan={(p) => setConfirm(p)} />
        : <ProfileScreen profile={profile} setProfile={setProfile} plansCount={plans.length} dark={t.dark} onToggleDark={(v) => setTweak("dark", v)} onSignOut={signOut} />;

  return (
    <ThemeCtx.Provider value={T}>
      <div style={{
        minHeight: "100vh", width: "100%", display: "flex", alignItems: "center", justifyContent: "center",
        background: "radial-gradient(120% 100% at 50% 0%, #211d1a 0%, #131110 60%, #0b0a09 100%)",
        padding: 24, boxSizing: "border-box", fontFamily: "'Archivo', system-ui, sans-serif",
      }}>
        <IOSDevice dark={t.dark}>
          <div style={{ position: "relative", height: "100%", overflow: "hidden", background: T.bg }}>
            {onboarded ? (
              <>
                {screen}
                <TabBar tab={tab} onTab={(id) => { setDetailId(null); setTab(id); }} />
                {detail && (
                  <DetailScreen d={detail} onBack={() => setDetailId(null)} onClaim={(d) => setClaimDrop(d)} />
                )}
                {claimDrop && (
                  <ClaimScreen d={claimDrop} onBack={() => setClaimDrop(null)} onConfirm={doConfirm} />
                )}
                {confirm && (
                  <ConfirmScreen claim={confirm} onPlans={goPlans} onDone={goTonight} />
                )}
                {filtersOpen && (
                  <FiltersSheet initial={filters} onClose={() => setFiltersOpen(false)}
                    onApply={(f) => { setFilters(f); setFiltersOpen(false); }} />
                )}
              </>
            ) : (
              <Onboarding key={t.intro} tone={t.intro} onComplete={completeOnboarding} />
            )}
          </div>
        </IOSDevice>

        <TweaksPanel>
          <TweakSection label="Theme" />
          <TweakToggle label="Nocturnal (dark)" value={t.dark} onChange={(v) => setTweak("dark", v)} />
          <TweakColor label="Accent" value={t.accent}
            options={["#FF5A4D", "#FF7A1A", "#D6149A"]}
            onChange={(v) => setTweak("accent", v)} />
          <TweakSection label="Onboarding" />
          <TweakRadio label="Intro tone" value={t.intro} options={["Minimal", "Editorial"]}
            onChange={(v) => { setTweak("intro", v); setOnboarded(false); }} />
          <TweakButton label="Replay onboarding" onClick={() => setOnboarded(false)} />
          <TweakSection label="Home feed" />
          <TweakRadio label="Layout" value={t.home} options={["Editorial", "Compact"]}
            onChange={(v) => setTweak("home", v)} />
        </TweaksPanel>
      </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
